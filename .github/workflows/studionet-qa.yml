name: Studionet end-to-end (isolated QA, network writes)
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  contents: read
jobs:
  network-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical Studionet RPC and chain ID before any writes
        run: |
          python - <<'PY'
          import json, urllib.request
          rpc="https://studio.genlayer.com/api"
          payload=json.dumps({"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}).encode()
          req=urllib.request.Request(rpc,data=payload,headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as f:
              result=json.load(f)
          if "error" in result: raise RuntimeError("Studionet returned RPC error: "+str(result["error"]))
          chain=int(result["result"],16)
          print("Studio chain ID:",chain)
          if chain!=61999: raise RuntimeError("Network identity mismatch; refusing to sign or deploy")
          PY
      - name: Install pinned official GenLayer Studio test SDK
        run: python -m pip install 'genlayer-py==0.16.3' 'genlayer-test==0.29.2' 'pytest>=8,<9'
      - name: Run ONE real Studionet integration scenario (no model mocks)
        run: |
          gltest --network studionet --default-wait-interval 2000 --default-wait-retries 50 -s -q tests/studio/test_studionet.py
